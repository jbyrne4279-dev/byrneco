<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" role="img" aria-labelledby="t5">
<title id="t5">Diagram of rising damp in a solid brick wall, showing groundwater drawn up through masonry with a tide mark and a failed damp-proof course</title>
<rect width="500" height="340" fill="#eef2f5"/>
<g stroke="#24445e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <rect x="140" y="30" width="220" height="270" fill="#ffffff"/>
  <!-- brick coursing -->
  <g stroke="#c3ccd3" stroke-width="1.5">
    <line x1="140" y1="60" x2="360" y2="60"/>
    <line x1="140" y1="90" x2="360" y2="90"/>
    <line x1="140" y1="120" x2="360" y2="120"/>
    <line x1="140" y1="150" x2="360" y2="150"/>
    <line x1="140" y1="180" x2="360" y2="180"/>
    <line x1="140" y1="210" x2="360" y2="210"/>
    <line x1="140" y1="240" x2="360" y2="240"/>
    <line x1="140" y1="270" x2="360" y2="270"/>
  </g>
  <!-- damp rising fill -->
  <rect x="140" y="220" width="220" height="80" fill="#3f6f95" opacity="0.25" stroke="none"/>
  <path d="M140 220 Q180 210 220 220 T300 220 T360 220" stroke="#3f6f95" stroke-width="2"/>
  <!-- DPC line -->
  <line x1="130" y1="260" x2="370" y2="260" stroke="#b3392c" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- ground -->
  <line x1="0" y1="300" x2="500" y2="300" stroke-width="4"/>
  <path d="M0 300 q20 8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#8a97a3" stroke-width="2"/>
</g>
<g fill="#24445e" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="375" y="264" fill="#b3392c">Damp-proof course (failed)</text>
  <text x="375" y="235" fill="#3f6f95">Rising damp, approx. 1m</text>
  <text x="150" y="330" fill="#8a97a3">Groundwater</text>
</g>
</svg>
