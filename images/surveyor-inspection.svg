<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="t2">
<title id="t2">Line illustration of a chartered surveyor inspecting a roof with a clipboard</title>
<rect width="500" height="500" fill="#eef2f5"/>
<g stroke="#24445e" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- house gable -->
  <rect x="90" y="220" width="320" height="220" fill="#ffffff"/>
  <polygon points="90,220 250,110 410,220" fill="#3f6f95" opacity="0.18"/>
  <rect x="150" y="270" width="55" height="70" fill="#c3ccd3" opacity="0.5"/>
  <rect x="295" y="270" width="55" height="70" fill="#c3ccd3" opacity="0.5"/>
  <rect x="225" y="360" width="50" height="80" fill="#8a97a3" opacity="0.4"/>
  <rect x="235" y="110" width="20" height="32"/>
  <!-- ladder -->
  <line x1="370" y1="440" x2="410" y2="160" stroke-width="4"/>
  <line x1="390" y1="440" x2="430" y2="160" stroke-width="4"/>
  <line x1="373" y1="410" x2="393" y2="410"/>
  <line x1="376" y1="370" x2="396" y2="370"/>
  <line x1="379" y1="330" x2="399" y2="330"/>
  <line x1="382" y1="290" x2="402" y2="290"/>
  <line x1="385" y1="250" x2="405" y2="250"/>
  <line x1="388" y1="210" x2="408" y2="210"/>
  <!-- surveyor figure -->
  <circle cx="418" cy="175" r="14" fill="#ffffff"/>
  <path d="M418 189 L418 225" stroke-width="4"/>
  <path d="M418 200 L395 215" stroke-width="4"/>
  <path d="M418 200 L440 190" stroke-width="4"/>
  <path d="M418 225 L400 260" stroke-width="4"/>
  <path d="M418 225 L436 260" stroke-width="4"/>
  <!-- clipboard -->
  <rect x="430" y="185" width="20" height="26" rx="2" fill="#ffffff"/>
  <line x1="434" y1="192" x2="446" y2="192"/>
  <line x1="434" y1="198" x2="446" y2="198"/>
  <line x1="434" y1="204" x2="446" y2="204"/>
</g>
</svg>
